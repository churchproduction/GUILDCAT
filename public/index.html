  <div class="evign"></div>
  <div class="rainlayer" id="rainlayer"></div>

  <div class="hero">
    <div class="logocircle"><img src="logo.png" alt="GuildCat Games"></div>

    <button type="button" id="enterBtn" class="btn primary enterbtn">ENTER</button>

<!-- ═══ Panel ═══ -->
<div class="mtop" id="mtop" hidden>
  <span class="brandlogo" style="width:26px;height:26px"><img src="logo.png" alt=""></span>
  <span class="name">WARDEN</span>
  <span class="mav" id="mav"></span>
</div>
<div class="shell" id="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/"><span class="brandlogo"><img src="logo.png" alt=""></span><span class="name">WARDEN</span></a>
    <div class="runes">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
    <nav class="snav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="whoami" id="whoami"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="mnav" id="mnav" hidden></nav>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
