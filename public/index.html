<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>GuildCat — Warden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png">
</head>
<body>

<!-- ═══ Sign-in (shown only when signed out) ═══ -->
<div class="enter simple" id="enter" hidden>
  <div class="logincard">
    <div class="logocircle sm"><img src="logo.png" alt="GuildCat Games"></div>
    <h1>WARDEN</h1>
    <p class="esub">GuildCat moderation panel · staff only</p>
    <button type="button" id="enterBtn" class="btn primary enterbtn">Sign in with Discord</button>
  </div>
</div>

<!-- ═══ Panel ═══ -->
<div class="mtop" id="mtop" hidden>
  <span class="brandlogo" style="width:26px;height:26px"><img src="logo.png" alt=""></span>
  <span class="name">WARDEN</span>
  <span class="mav" id="mav"></span>
</div>
<div class="shell" id="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/"><span class="brandlogo"><img src="logo.png" alt=""></span><span class="name">WARDEN</span></a>
    <div class="runes">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
    <nav class="snav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="whoami" id="whoami"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="mnav" id="mnav" hidden></nav>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
